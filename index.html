
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Bronze & Purple | High-End Creative Agency</title>
  <link rel="icon" type="image/png" href="./src/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Montserrat:wght@100;200;300;400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bronze: #cd7f32;
        --deep-purple: #2d1b4d;
        --luxury-black: #0a0a0a;
      }
      body {
        font-family: 'Montserrat', sans-serif;
        background-color: var(--luxury-black);
        color: #ffffff;
        overflow-x: hidden;
      }
      .font-serif {
        font-family: 'Cormorant Garamond', serif;
      }
      .text-bronze {
        color: #b8860b;
      }
      .bg-bronze {
        background-color: #b8860b;
      }
      
      /* Luxury Button Hover - Background Slide */
      .btn-luxury {
        position: relative;
        overflow: hidden;
        transition: color 0.5s ease;
        z-index: 1;
      }
      .btn-luxury::before {
        content: '';
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        height: 100%;
        background: #b8860b;
        transition: top 0.5s cubic-bezier(0.21, 1, 0.36, 1);
        z-index: -1;
      }
      .btn-luxury:hover::before {
        top: 0;
      }
      .btn-luxury:hover {
        color: #fff !important;
      }

      /* Image Reveal Animation */
      .img-reveal-container {
        overflow: hidden;
      }
      .img-reveal-img {
        transform: scale(1.2);
        transition: transform 1.5s cubic-bezier(0.21, 1, 0.36, 1);
      }
      .img-reveal-container.in-view .img-reveal-img {
        transform: scale(1);
      }

      /* Luxury Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b8860b;
      }
    </style>
   
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
